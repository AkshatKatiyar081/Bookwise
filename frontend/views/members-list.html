<div>
  <div class="page-header">
    <h1>Members</h1>
    <button class="btn btn-primary" ng-click="openAddModal()">👤 Register Member</button>
  </div>

  <div class="alert alert-error" ng-if="error">{{error}}</div>
  <div class="alert alert-success" ng-if="success">{{success}}</div>

  <!-- Search -->
  <div class="search-bar">
    <div class="search-input-wrap">
      <input type="text" class="form-control" ng-model="searchQuery"
             placeholder="Search members by name or email...">
    </div>
  </div>

  <div class="loading-state" ng-if="loading">
    <div class="loading-spinner"></div>
  </div>

  <!-- Members Table -->
  <div class="table-wrap" ng-if="!loading">
    <table class="data-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Type</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr ng-repeat="m in filteredMembers()">
          <td><a href="#!/members/{{m.member_id}}">{{m.name}}</a></td>
          <td class="text-muted">{{m.email}}</td>
          <td>{{m.phone || '—'}}</td>
          <td><span class="badge badge-{{m.membership_type}}">{{m.membership_type}}</span></td>
          <td><span class="badge badge-{{m.status}}">{{m.status}}</span></td>
          <td>
            <div class="btn-group">
              <a href="#!/members/{{m.member_id}}" class="btn btn-sm btn-outline">View</a>
              <button class="btn btn-sm" ng-click="toggleStatus(m)"
                      ng-class="{'btn-danger': m.status === 'active', 'btn-success': m.status !== 'active'}">
                {{m.status === 'active' ? 'Suspend' : 'Activate'}}
              </button>
            </div>
          </td>
        </tr>
        <tr ng-if="filteredMembers().length === 0">
          <td colspan="6" class="text-center text-muted" style="padding: 32px;">No members found</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Add Member Modal -->
  <div class="modal-overlay" ng-if="showAddModal" ng-click="closeAddModal()">
    <div class="modal-box" ng-click="$event.stopPropagation()" style="max-width: 520px;">
      <h3>Register New Member</h3>
      <form ng-submit="addMember()" style="margin-top: 16px;">
        <div class="form-row">
          <div class="form-group">
            <label>Name *</label>
            <input type="text" class="form-control" ng-model="newMember.name" required>
          </div>
          <div class="form-group">
            <label>Email *</label>
            <input type="email" class="form-control" ng-model="newMember.email" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" class="form-control" ng-model="newMember.phone">
          </div>
          <div class="form-group">
            <label>Type</label>
            <select class="form-control" ng-model="newMember.membership_type">
              <option value="student">Student</option>
              <option value="faculty">Faculty</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Address</label>
          <input type="text" class="form-control" ng-model="newMember.address">
        </div>
        <div class="form-group">
          <label>Password *</label>
          <input type="password" class="form-control" ng-model="newMember.password" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" ng-click="closeAddModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Register</button>
        </div>
      </form>
    </div>
  </div>
</div>
