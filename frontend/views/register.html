<div class="auth-page">
  <div class="auth-card" style="max-width: 520px;">
    <div class="auth-icon">📝</div>
    <h1>Create Account</h1>
    <p class="auth-subtitle">Join the Bookwise library community</p>

    <div class="alert alert-error" ng-if="error">{{error}}</div>

    <form ng-submit="register()" novalidate>
      <div class="form-group">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" class="form-control" ng-model="registerData.name"
               placeholder="Your full name" required>
        <span class="form-error" ng-show="registerData.name && registerData.name.length < 2">
          Name must be at least 2 characters.
        </span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-control" ng-model="registerData.email"
                 placeholder="you@college.edu" required>
        </div>
        <div class="form-group">
          <label for="reg-phone">Phone Number</label>
          <input type="tel" id="reg-phone" class="form-control" ng-model="registerData.phone"
                 placeholder="9876543210">
        </div>
      </div>

      <div class="form-group">
        <label for="reg-address">Address</label>
        <input type="text" id="reg-address" class="form-control" ng-model="registerData.address"
               placeholder="Hostel / Block / City">
      </div>

      <div class="form-group">
        <label for="reg-type">Membership Type</label>
        <select id="reg-type" class="form-control" ng-model="registerData.membership_type">
          <option value="student">Student</option>
          <option value="faculty">Faculty</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="reg-pass">Password</label>
          <input type="password" id="reg-pass" class="form-control" ng-model="registerData.password"
                 placeholder="Min 6 characters" required>
          <span class="form-error" ng-show="registerData.password && registerData.password.length < 6">
            Password must be at least 6 characters.
          </span>
        </div>
        <div class="form-group">
          <label for="reg-confirm">Confirm Password</label>
          <input type="password" id="reg-confirm" class="form-control" ng-model="registerData.confirmPassword"
                 placeholder="Re-enter password" required>
          <span class="form-error" ng-show="registerData.confirmPassword && registerData.password !== registerData.confirmPassword">
            Passwords do not match.
          </span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" ng-disabled="loading">
        <span ng-if="!loading">Create Account</span>
        <span ng-if="loading">Creating...</span>
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="#!/login">Sign in</a>
    </div>
  </div>
</div>
