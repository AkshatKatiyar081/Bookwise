<div>
  <div class="page-header">
    <h1>Fines Management</h1>
    <div class="flex-gap" ng-if="!loading">
      <span class="text-muted">Outstanding:</span>
      <strong class="text-danger">₹{{totalOutstanding().toFixed(2)}}</strong>
      <span class="text-muted" style="margin-left: 12px;">Collected:</span>
      <strong class="text-success">₹{{totalCollected().toFixed(2)}}</strong>
    </div>
  </div>

  <div class="alert alert-error" ng-if="error">{{error}}</div>
  <div class="alert alert-success" ng-if="success">{{success}}</div>

  <!-- Filter -->
  <div class="filter-bar">
    <button class="filter-btn" ng-class="{active: !showUnpaidOnly}" ng-click="showUnpaidOnly && toggleUnpaid()">All Fines</button>
    <button class="filter-btn" ng-class="{active: showUnpaidOnly}" ng-click="!showUnpaidOnly && toggleUnpaid()">Unpaid Only</button>
  </div>

  <div class="loading-state" ng-if="loading">
    <div class="loading-spinner"></div>
  </div>

  <div class="table-wrap" ng-if="!loading">
    <table class="data-table">
      <thead>
        <tr>
          <th>Member</th>
          <th>Book</th>
          <th>Amount</th>
          <th>Date</th>
          <th>Status</th>
          <th ng-if="isAdmin">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr ng-repeat="f in fines">
          <td>{{f.member_name}}</td>
          <td>{{f.book_title}}</td>
          <td><strong>₹{{f.amount}}</strong></td>
          <td>{{formatDate(f.fine_date)}}</td>
          <td>
            <span class="badge" ng-class="{'badge-returned': f.paid, 'badge-overdue': !f.paid}">
              {{f.paid ? 'Paid' : 'Unpaid'}}
            </span>
          </td>
          <td ng-if="isAdmin">
            <button class="btn btn-sm btn-success" ng-click="payFine(f.fine_id)" ng-if="!f.paid">
              Mark Paid
            </button>
            <span class="text-muted" ng-if="f.paid"></span>
          </td>
        </tr>
        <tr ng-if="fines.length === 0">
          <td colspan="6" class="text-center text-muted" style="padding: 32px;">
            <div class="empty-icon"></div>
            No fines found
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
