<div class="auth-page">
  <div class="auth-card">
    <div class="auth-icon">📖</div>
    <h1>Library Portal</h1>
    <p class="auth-subtitle">Sign in to your Bookwise account</p>

    <div class="alert alert-error" ng-if="error">{{error}}</div>

    <form ng-submit="login()" novalidate>
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" class="form-control" ng-model="loginData.email"
               placeholder="you@college.edu" required>
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" class="form-control" ng-model="loginData.password"
               placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary" ng-disabled="loading">
        <span ng-if="!loading">Sign In</span>
        <span ng-if="loading">Signing in...</span>
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="#!/register">Register here</a>
    </div>
  </div>
</div>
